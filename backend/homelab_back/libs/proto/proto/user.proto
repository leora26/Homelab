syntax = "proto3";
package user;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "types.proto";

service UserService {
  rpc GetById (GetUserByIdRequest) returns (UserResponse);
  rpc GetByEmail (GetUserByEmailRequest) returns (UserResponse);
  rpc GetAll (google.protobuf.Empty) returns (UserList);
  rpc Finalize (FinalizeUserRequest) returns (google.protobuf.Empty);
  rpc ToggleBlockState (ToggleBlockStatusRequest) returns (google.protobuf.Empty);
  rpc SetStorageQuota (SetStorageQuotaRequest) returns (google.protobuf.Empty);
}

enum Role {
  ROLE_USER = 0;
  ROLE_ADMIN = 1;
}

message UserResponse {
  common.EntityId id = 1;
  string email = 2;
  string full_name = 3;
  Role role = 4;
  google.protobuf.Timestamp created_at = 5;
}

message UserList {
  repeated UserResponse users = 1;
}

message GetUserByIdRequest {
  common.EntityId id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message FinalizeUserRequest {
  string email = 1;
  string full_name = 2;
}


message ToggleBlockStatusRequest {
  common.EntityId id = 1;
  bool is_blocked = 2;
}

message SetStorageQuotaRequest {
  common.EntityId id = 1;
  int64 allowed_storage = 2;
}